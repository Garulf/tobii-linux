[package]
name = "tobii-experience"
description = "Tobii Experience for Linux: tray state model, service link and the GTK 4 app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
gtk = ["dep:gtk4", "dep:async-channel"]

[dependencies]
async-channel = { workspace = true, optional = true }
gtk4 = { version = "0.11", features = ["v4_14"], optional = true }
ksni.workspace = true
log.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
tobii-control.workspace = true
tobii-gaze.workspace = true

[[bin]]
name = "tobii-linux-experience"
path = "src/main.rs"
required-features = ["gtk"]

[[test]]
name = "instance"
harness = false
required-features = ["gtk"]

[[test]]
name = "page"
harness = false
required-features = ["gtk"]

[lints]
workspace = true
