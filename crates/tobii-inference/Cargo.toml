[package]
name = "tobii-inference"
description = "Tobii's neural networks on OpenVINO: legacy IR translation, the D1 landmark crop and decoding, its quality gate and the face finder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libloading.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tobii-models.workspace = true

# The workspace lints, except that unsafe code is denied rather than forbidden: the
# OpenVINO C API binding in src/openvino/ffi.rs is the one module allowed to use it.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
disallowed_methods = "deny"
