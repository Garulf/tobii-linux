[package]
name = "tobii-py"
description = "Python bindings, imported as tobii_linux._native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
log.workspace = true
pyo3.workspace = true
serde_json.workspace = true
tobii-device.workspace = true
tobii-models.workspace = true
tobii-protocol.workspace = true
tobii-usb.workspace = true

[lints]
workspace = true
