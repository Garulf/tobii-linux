[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
tobii-protocol = { path = "crates/tobii-protocol" }
tobii-usb = { path = "crates/tobii-usb" }
tobii-device = { path = "crates/tobii-device" }
tobii-models = { path = "crates/tobii-models" }
tobii-headpose = { path = "crates/tobii-headpose" }
hmac = "0.13"
md-5 = "0.11"
nusb = "0.2.8"
log = "0.4"
serde_json = "1"
rustix = { version = "1", features = ["time"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
thiserror = "2"
memchr = "2"
miniz_oxide = "0.8"
roxmltree = "0.21"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"
