[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tobii-linux"
version = "0.1.0"
description = "Native Eye Tracker 5 USB transport research (tracking protocol incomplete)"
requires-python = ">=3.10"

[project.scripts]
tobii-linux = "tobii_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
