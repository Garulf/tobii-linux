[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tobii-linux"
version = "0.1.0"
description = "Experimental native Eye Tracker 5 head-pose driver"
requires-python = ">=3.10"

[project.optional-dependencies]
headpose = ["numpy", "openvino"]

[project.scripts]
tobii-linux = "tobii_linux.cli:main"

[tool.maturin]
manifest-path = "crates/tobii-py/Cargo.toml"
python-source = "src"
module-name = "tobii_linux._native"
