[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tobii-linux"
version = "0.1.0"
description = "Experimental native Eye Tracker 5 head-pose driver"
requires-python = ">=3.10"

[project.optional-dependencies]
headpose = ["numpy", "openvino"]

[project.scripts]
tobii-linux = "tobii_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
