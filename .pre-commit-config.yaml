exclude: ^models/
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/Garulf/readwright
    rev: v0.5.0
    hooks:
      - id: readwright-check
        stages: [pre-push]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|clippy\.toml)$
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: unittest
        name: unittest
        entry: make --no-print-directory test PYTHON=python3
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
