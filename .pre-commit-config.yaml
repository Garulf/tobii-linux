exclude: ^models/
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/Garulf/readwright
    rev: v0.5.0
    hooks:
      - id: readwright-check
        stages: [pre-push]
  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: env PYTHONPATH=.local/inference:src OPENBLAS_NUM_THREADS=2 python3 -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
